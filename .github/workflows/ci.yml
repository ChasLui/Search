---
name: macOS CI

'on':
  push:
    branches: [chaslui-dev]
  pull_request:
    branches: [chaslui-dev]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Swift and localization tests
        run: python3 Tests/run-ci-tests.py

  beta-dmg:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build beta DMG
        id: dmg
        env:
          SEARCH_BETA: '3'
          SEARCH_SIGN_IDENTITY: ''
        run: |
          ./build.sh release dmg
          hdiutil verify build/Search.dmg
          plist=build/Search.app/Contents/Info.plist
          version=$(plutil -extract CFBundleShortVersionString raw "$plist")
          artifact="Search-${version}-$(uname -m)"
          mv build/Search.dmg "build/${artifact}.dmg"
          echo "name=$artifact" >> "$GITHUB_OUTPUT"

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: build/${{ steps.dmg.outputs.name }}.dmg
          if-no-files-found: error
          compression-level: 0
