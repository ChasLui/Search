---
title: 项目变更
description: 实现聚焦变更并进行独立静态审查，保留验证证据。
outcomes: [success, needs_changes, review_incomplete]
inputs:
  request:
    type: string
    required: true
    description: 需要解决的问题、期望行为及已知约束
outputs:
  implementation:
    type: string
  review:
    type: string
steps:
  - id: implement
    title: 实现和验证
    manage:
      auto_start: false
    role:
      name: implementer
      prompt: |
        请求：{{ inputs.request }}
        输出 implementation，列出本次改动、验证结果和未验证项。
    inputs: [request]
    outputs:
      implementation:
        type: string
    outcomes: [success, needs_input, failure]
    "on":
      needs_input:
        ask: 请查看步骤摘要，明确回答具体问题或说明批准的具体操作。
        max_loops: 3
  - id: review
    title: 独立静态审查
    needs: [implement]
    role:
      name: reviewer
      prompt: |
        请求：{{ inputs.request }}
        实现报告：{{ inputs.implementation }}
        审查本次变更及相关调用方和测试，输出 review。
        确认存在必须修复的问题时报告 needs_changes；已有修改重叠
        且无法可靠区分时报告 review_incomplete；否则报告 success。
        尚未验证的内容要写清楚。
    inputs: [request, implementation]
    outputs:
      review:
        type: string
    outcomes: [success, needs_changes, review_incomplete, failure]
    "on":
      needs_changes:
        end: needs_changes
      review_incomplete:
        end: review_incomplete
